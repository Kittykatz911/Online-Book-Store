<html>

        <title>Online Book Store</title>
        <link rel="stylesheet" href="styles.css">
        <script src="script.js"></script>
    </head>
    <body>
        <header>
            <h1>Welcome to the Online Book Store!</h1>
        </header>
        <nav>
            <a href="#home">Home</a>
            <a href="#books">Books</a>
            <a href="#cart">Cart</a>

                <h3>Sample Book 1</h3>
                <p>Author Name</p>
                <button>Add to Cart</button>
            </div>
            <div class="book-card">
                <img src="https://images.unsplash.com/photo-1512820790803-83ca734da794?auto=format&fit=crop&w=500&q=80" alt="Book Cover">
                <h3>Sample Book 2</h3>
                <p>Author Name</p>
                <button>Add to Cart</button>
            </div>
            <div class="book-card">
                <img src="https://images.unsplash.com/photo-1473862177706-7ec551ca886e?auto=format&fit=crop&w=500&q=80" alt="Book Cover">
                <h3>Sample Book 3</h3>
                <p>Author Name</p>
                <button>Add to Cart</button>
            </div>

</html>
